name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tranquilo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK одной ссылкой: Releases → latest → Tranquilo.apk
      # Заголовок — версия из build.gradle.kts, описание — раздел этой версии из CHANGELOG.md.
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tranquilo.apk

          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || true)
          VERSION=${VERSION:-"сборка ${{ github.run_number }}"}

          awk -v header="## $VERSION" '
            $0 == header { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > notes.md || true
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Описание этой версии в CHANGELOG пока не добавлено." > notes.md
          fi
          {
            echo ""
            echo "[Все изменения](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) · сборка ${{ github.run_number }} · коммит ${{ github.sha }}"
          } >> notes.md

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tranquilo.apk \
            --title "Tranquilo $VERSION" \
            --notes-file notes.md
